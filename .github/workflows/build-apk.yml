name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Generate Android host
        shell: bash
        run: |
          set -euxo pipefail
          flutter create --platforms=android --org com.qurankareem --project-name quran_kareem .
          git checkout -- pubspec.yaml lib/main.dart analysis_options.yaml || true
          rm -f test/widget_test.dart

      - name: Fetch all 604 Madinah Mushaf pages
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/daily-quran
          git clone --depth 1 --filter=blob:none --sparse https://github.com/Bsracc/daily-quran.git /tmp/daily-quran
          git -C /tmp/daily-quran sparse-checkout set app/src/main/assets/mushaf_pages
          mkdir -p assets/mushaf_pages
          cp /tmp/daily-quran/app/src/main/assets/mushaf_pages/page_*.webp assets/mushaf_pages/
          count="$(find assets/mushaf_pages -maxdepth 1 -name 'page_*.webp' | wc -l | tr -d ' ')"
          test "$count" = "604"
          test -s assets/mushaf_pages/page_001.webp
          test -s assets/mushaf_pages/page_604.webp

      - name: Set Android app name
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          s = s.replace('android:label="quran_kareem"', 'android:label="القرآن الكريم"')
          p.write_text(s, encoding="utf-8")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Mushaf reader
        run: flutter analyze lib/main.dart --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-kareem-madinah-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
